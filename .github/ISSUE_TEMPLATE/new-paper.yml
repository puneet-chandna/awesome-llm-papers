name: 📄 Submit a Paper
description: Suggest a paper with a distinct contribution and lasting reader value
title: "[Paper]: "
labels: ["new-paper", "pending-review"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping readers find work worth studying.
        Older papers, preprints and research resources are welcome when evidence supports their value.
        Reviews happen as maintainer time permits.
  - type: input
    id: paper-title
    attributes:
      label: Title
      description: Full paper or research-resource title
    validations:
      required: true
  - type: input
    id: paper-link
    attributes:
      label: Primary source
      description: Author, arXiv, OpenReview or official publication link
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: Authors and public date
      description: Identify authors, first public date and document type; note uncertainty if needed
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Distinct contribution and reader value
      description: What does this work add over its closest predecessors, and what will a reader learn?
    validations:
      required: true
  - type: textarea
    id: evidence-limits
    attributes:
      label: Evidence and limitations
      description: Identify supporting sections and a limitation. Scope scores to model, task, data and budget.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Primary category
      options:
        - Model Architectures
        - Reasoning & Agents
        - Efficiency & Scaling
        - Training & Alignment
        - Multimodal Models
        - RAG & Knowledge
        - Safety & Security
        - Analysis & Theory
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Code, data or related resources (optional)
      description: Link available author resources and related work. Code is not required.
  - type: checkboxes
    id: checklist
    attributes:
      label: Submission check
      options:
        - label: I checked the index and topic pages for the title or identifier, including alternate titles and URLs.
          required: true
        - label: I separated reported results from my recommendation and described a meaningful limitation.
          required: true
